# Intelligent Storage Lifecycle Management for Lyceum Cluster Data
# Automatically moves data through different storage tiers for cost optimization

apiVersion: storage.cnrm.cloud.google.com/v1beta1
kind: StorageBucket
metadata:
  name: lyceum-cluster-data
  namespace: default
  labels:
    environment: production
    cost-optimization: enabled
    data-type: analytics
spec:
  location: US-CENTRAL1
  storageClass: STANDARD  # Hot tier for recent data
  
  # Uniform bucket-level access for better security
  uniformBucketLevelAccess: true
  
  # Public access prevention
  publicAccessPrevention: enforced
  
  # Versioning for data protection
  versioning:
    enabled: true
  
  # Intelligent lifecycle management
  lifecycle:
    rule:
    # Move to Nearline after 7 days (Warm tier)
    - action:
        type: SetStorageClass
        storageClass: NEARLINE
      condition:
        age: 7
        matchesStorageClass:
        - STANDARD
    
    # Move to Coldline after 30 days (Cold tier)  
    - action:
        type: SetStorageClass
        storageClass: COLDLINE
      condition:
        age: 30
        matchesStorageClass:
        - NEARLINE
        - STANDARD
    
    # Move to Archive after 1 year (Archive tier)
    - action:
        type: SetStorageClass
        storageClass: ARCHIVE
      condition:
        age: 365
        matchesStorageClass:
        - COLDLINE
        - NEARLINE
        - STANDARD
    
    # Delete after 7 years (compliance/cost optimization)
    - action:
        type: Delete
      condition:
        age: 2555  # 7 years
    
    # Delete incomplete multipart uploads after 1 day
    - action:
        type: AbortIncompleteMultipartUpload
      condition:
        age: 1
    
    # Delete non-current versions after 30 days
    - action:
        type: Delete
      condition:
        age: 30
        isLive: false
    
    # Move old versions to cheaper storage
    - action:
        type: SetStorageClass
        storageClass: COLDLINE
      condition:
        age: 7
        isLive: false
        matchesStorageClass:
        - STANDARD
        - NEARLINE
  
  # CORS configuration for web access
  cors:
  - origin:
    - https://app.lyceum.io
    - https://lyceum.io
    method:
    - GET
    - POST
    - PUT
    - DELETE
    - HEAD
    responseHeader:
    - Content-Type
    - Content-Range
    - Content-Encoding
    - Date
    - ETag
    - Range
    maxAgeSeconds: 3600
  
  # Website configuration (if needed for static assets)
  website:
    mainPageSuffix: index.html
    notFoundPage: 404.html
  
  # Logging configuration
  logging:
    logBucket: lyceum-access-logs
    logObjectPrefix: cluster-data/
  
  # Retention policy (optional, for compliance)
  retentionPolicy:
    retentionPeriod: 86400  # 1 day minimum retention
    isLocked: false

---
# Separate bucket for processed results with different lifecycle
apiVersion: storage.cnrm.cloud.google.com/v1beta1
kind: StorageBucket
metadata:
  name: lyceum-processed-results
  namespace: default
  labels:
    environment: production
    cost-optimization: enabled
    data-type: processed-curves
spec:
  location: US-CENTRAL1
  storageClass: STANDARD
  uniformBucketLevelAccess: true
  publicAccessPrevention: enforced
  versioning:
    enabled: true
  
  # Different lifecycle for processed results
  lifecycle:
    rule:
    # Keep hot for 3 days (frequently accessed)
    - action:
        type: SetStorageClass
        storageClass: NEARLINE
      condition:
        age: 3
        matchesStorageClass:
        - STANDARD
    
    # Move to cold after 14 days
    - action:
        type: SetStorageClass
        storageClass: COLDLINE
      condition:
        age: 14
        matchesStorageClass:
        - NEARLINE
        - STANDARD
    
    # Archive after 90 days
    - action:
        type: SetStorageClass
        storageClass: ARCHIVE
      condition:
        age: 90
        matchesStorageClass:
        - COLDLINE
        - NEARLINE
        - STANDARD
    
    # Delete after 5 years
    - action:
        type: Delete
      condition:
        age: 1825  # 5 years
    
    # Cleanup incomplete uploads
    - action:
        type: AbortIncompleteMultipartUpload
      condition:
        age: 1

---
# Bucket for access logs
apiVersion: storage.cnrm.cloud.google.com/v1beta1
kind: StorageBucket
metadata:
  name: lyceum-access-logs
  namespace: default
  labels:
    environment: production
    data-type: access-logs
spec:
  location: US-CENTRAL1
  storageClass: COLDLINE  # Start cold since logs are rarely accessed
  uniformBucketLevelAccess: true
  publicAccessPrevention: enforced
  
  # Aggressive lifecycle for logs
  lifecycle:
    rule:
    # Delete logs after 90 days
    - action:
        type: Delete
      condition:
        age: 90
    
    # Cleanup incomplete uploads immediately
    - action:
        type: AbortIncompleteMultipartUpload
      condition:
        age: 1

---
# Bucket for temporary/cache data
apiVersion: storage.cnrm.cloud.google.com/v1beta1
kind: StorageBucket
metadata:
  name: lyceum-cache-storage
  namespace: default
  labels:
    environment: production
    data-type: cache
spec:
  location: US-CENTRAL1
  storageClass: STANDARD
  uniformBucketLevelAccess: true
  publicAccessPrevention: enforced
  versioning:
    enabled: false  # No versioning for cache data
  
  # Short lifecycle for cache data
  lifecycle:
    rule:
    # Delete cache data after 7 days
    - action:
        type: Delete
      condition:
        age: 7
    
    # Cleanup incomplete uploads quickly
    - action:
        type: AbortIncompleteMultipartUpload
      condition:
        age: 1

---
# IAM policy for storage buckets
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: storage-admin-binding
  namespace: default
spec:
  member: serviceAccount:lyceum-cluster-manager@lyceum-clusters-optimized.iam.gserviceaccount.com
  role: roles/storage.admin
  resourceRef:
    apiVersion: storage.cnrm.cloud.google.com/v1beta1
    kind: StorageBucket
    name: lyceum-cluster-data

---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: processed-results-admin-binding
  namespace: default
spec:
  member: serviceAccount:lyceum-cluster-manager@lyceum-clusters-optimized.iam.gserviceaccount.com
  role: roles/storage.admin
  resourceRef:
    apiVersion: storage.cnrm.cloud.google.com/v1beta1
    kind: StorageBucket
    name: lyceum-processed-results




